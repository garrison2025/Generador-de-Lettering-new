name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=moderate

      - name: Content validation
        run: npm run validate

      - name: GSC opportunity analysis unit tests
        run: npm run test:gsc

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Build output performance validation
        run: npm run validate:build

      - name: Install browser smoke dependency
        run: python -m pip install --disable-pip-version-check selenium==4.36.0

      - name: Mobile browser smoke validation
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/gdl-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT

          READY=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            cat /tmp/gdl-preview.log
            exit 1
          fi

          python scripts/browser_smoke.py
