    <!-- Monetization scripts load only after explicit cookie consent -->
    <script>
      (function() {
        var monetizationScheduled = false;
        var monetizationEngagementArmed = false;
        var monetizationStarted = false;
        var monetizationFallbackTimer = null;
        var adsenseLoaded = false;

        function hasAcceptedConsent() {
          try {
            return localStorage.getItem('cookie_consent') === 'accepted';
          } catch (e) {
            return false;
          }
        }

        function appendScript(id, src, target, configure) {
          if (document.getElementById(id)) return;
          var script = document.createElement('script');
          script.id = id;
          script.src = src;
          script.async = true;
          if (configure) configure(script);
          (target || document.head || document.documentElement).appendChild(script);
        }

        function loadAdSense() {
          if (adsenseLoaded || !hasAcceptedConsent()) return;
          adsenseLoaded = true;
          appendScript(
            'adsense-script',
            'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1528586776567779',
            document.head,
            function(script) { script.crossOrigin = 'anonymous'; }
          );
          ['scroll', 'click', 'touchstart', 'mousemove'].forEach(function(eventName) {
            window.removeEventListener(eventName, loadAdSense);
          });
        }

        function clearMonetizationEngagementListeners() {
          ['pointerdown', 'scroll', 'touchstart'].forEach(function(eventName) {
            window.removeEventListener(eventName, startMonetizationFromEngagement);
          });
          window.removeEventListener('keydown', startMonetizationFromEngagement);
          if (monetizationFallbackTimer) {
            clearTimeout(monetizationFallbackTimer);
            monetizationFallbackTimer = null;
          }
        }

        function loadMonetizationScripts() {
          if (monetizationStarted || !hasAcceptedConsent() || !document.body) return;
          monetizationStarted = true;
          clearMonetizationEngagementListeners();

          appendScript(
            'monetag-vignette',
            'https://n6wxm.com/vignette.min.js',
            document.head,
            function(script) { script.dataset.zone = '11705116'; }
          );

          appendScript(
            'adsterra-social-bar',
            'https://pl26707745.profitableratecpmnetwork.com/aa/3e/7c/aa3e7c6a9214fa224ddd32eef045cb13.js',
            document.body
          );

          ['scroll', 'click', 'touchstart', 'mousemove'].forEach(function(eventName) {
            window.addEventListener(eventName, loadAdSense, { passive: true, once: true });
          });

          // Keep AdSense even farther away from the initial rendering path.
          setTimeout(loadAdSense, 5000);
        }

        function startMonetizationFromEngagement() {
          if (!hasAcceptedConsent()) return;
          loadMonetizationScripts();
        }

        function armMonetizationAfterEngagement() {
          if (monetizationEngagementArmed || monetizationStarted || !hasAcceptedConsent()) return;
          monetizationEngagementArmed = true;

          ['pointerdown', 'scroll', 'touchstart'].forEach(function(eventName) {
            window.addEventListener(eventName, startMonetizationFromEngagement, { passive: true, once: true });
          });
          window.addEventListener('keydown', startMonetizationFromEngagement, { once: true });

          // Do not let third-party ad code compete with the first render/LCP.
          // Users who do not interact still get monetization after a conservative delay.
          monetizationFallbackTimer = setTimeout(startMonetizationFromEngagement, 8000);
        }

        function scheduleMonetizationScripts() {
          if (monetizationScheduled || !hasAcceptedConsent()) return;
          monetizationScheduled = true;

          var scheduleIdle = function() {
            if ('requestIdleCallback' in window) {
              requestIdleCallback(armMonetizationAfterEngagement, { timeout: 3000 });
            } else {
              setTimeout(armMonetizationAfterEngagement, 1500);
            }
          };

          if (document.readyState === 'complete') {
            scheduleIdle();
          } else {
            window.addEventListener('load', scheduleIdle, { once: true });
          }
        }

        window.addEventListener('cookie-consent-accepted', scheduleMonetizationScripts);
        if (hasAcceptedConsent()) {
          scheduleMonetizationScripts();
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
