<!doctype html>
<html lang="es" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#5A4AD2" />
    <meta name="color-scheme" content="light" />

    <!-- Preconnect to Font APIs & Domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://pagead2.googlesyndication.com" />

    <!-- Critical Base Font (Inter) for Immediate Fast Render -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />

    <meta data-rh="true" name="description" content="Conversor y generador de letras bonitas, tipografías elegantes, cursivas y góticas para copiar y pegar en Instagram, TikTok, Facebook y WhatsApp." />
    <meta name="keywords" content="letras bonitas, conversor de letras, tipografias, letras para Instagram, letras cursivas, letras góticas, copiar y pegar" />
    <meta name="author" content="Generador de Lettering" />
    <meta name="monetag" content="7c3922469417dad557b4f10939f75588" />
    
    <!-- Open Graph Default Fallbacks -->
    <meta property="og:site_name" content="Generador de Lettering" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:image" content="https://generadordelettering.org/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta name="twitter:image" content="https://generadordelettering.org/og-image.jpg" />

    <!-- Icons and PWA -->
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    
    <!-- Twitter Cards Default -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@generadordelettering" />
    
    <title data-rh="true">Conversor de Letras Bonitas | Generador de Tipografías</title>

    <!-- Lazy Load Decorative Fonts after initial LCP/FCP render -->
    <script>
      window.addEventListener('load', function() {
        var loadFonts = function() {
          var fontLink = document.createElement('link');
          fontLink.rel = 'stylesheet';
          fontLink.href = 'https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Pacifico:wght@400&family=Parisienne:wght@400&family=Great+Vibes:wght@400&family=Courgette:wght@400&family=Caveat:wght@400;700&family=Alex+Brush:wght@400&family=Tangerine:wght@400;700&family=Amatic+SC:wght@400;700&family=Lobster:wght@400&family=Kaushan+Script:wght@400&family=Cookie:wght@400&family=Shadows+Into+Light:wght@400&family=Yellowtail:wght@400&family=Leckerli+One:wght@400&family=Permanent+Marker:wght@400&family=Rock+Salt:wght@400&family=Sacramento:wght@400&family=Handlee:wght@400&family=Pirata+One:wght@400&family=UnifrakturMaguntia:wght@400&family=Merienda:wght@400;700&display=swap';
          document.head.appendChild(fontLink);
        };
        if ('requestIdleCallback' in window) {
          requestIdleCallback(loadFonts);
        } else {
          setTimeout(loadFonts, 1500);
        }
      });
    </script>

    <!-- Monetization scripts load only after explicit cookie consent -->
    <script>
      (function() {
        var monetizationStarted = false;
        var adsenseLoaded = false;

        function hasAcceptedConsent() {
          try {
            return localStorage.getItem('cookie_consent') === 'accepted';
          } catch (e) {
            return false;
          }
        }

        function appendScript(id, src, target, configure) {
          if (document.getElementById(id)) return;
          var script = document.createElement('script');
          script.id = id;
          script.src = src;
          script.async = true;
          if (configure) configure(script);
          (target || document.head || document.documentElement).appendChild(script);
        }

        function loadAdSense() {
          if (adsenseLoaded || !hasAcceptedConsent()) return;
          adsenseLoaded = true;
          appendScript(
            'adsense-script',
            'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1528586776567779',
            document.head,
            function(script) { script.crossOrigin = 'anonymous'; }
          );
          ['scroll', 'click', 'touchstart', 'mousemove'].forEach(function(eventName) {
            window.removeEventListener(eventName, loadAdSense);
          });
        }

        function loadMonetizationScripts() {
          if (monetizationStarted || !hasAcceptedConsent()) return;
          monetizationStarted = true;

          appendScript(
            'monetag-vignette',
            'https://n6wxm.com/vignette.min.js',
            document.head,
            function(script) { script.dataset.zone = '11705116'; }
          );

          appendScript(
            'adsterra-social-bar',
            'https://pl26707745.profitableratecpmnetwork.com/aa/3e/7c/aa3e7c6a9214fa224ddd32eef045cb13.js',
            document.body || document.documentElement
          );

          ['scroll', 'click', 'touchstart', 'mousemove'].forEach(function(eventName) {
            window.addEventListener(eventName, loadAdSense, { passive: true, once: true });
          });

          if ('requestIdleCallback' in window) {
            requestIdleCallback(function() { setTimeout(loadAdSense, 5000); });
          } else {
            setTimeout(loadAdSense, 5000);
          }
        }

        window.addEventListener('cookie-consent-accepted', loadMonetizationScripts);
        if (hasAcceptedConsent()) {
          loadMonetizationScripts();
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
