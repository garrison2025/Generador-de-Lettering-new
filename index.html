    <!-- Lazy Load Decorative Fonts after initial LCP/FCP render -->
    <script>
      window.addEventListener('load', function() {
        var loadFonts = function() {
          var fontLink = document.createElement('link');
          fontLink.rel = 'stylesheet';
          fontLink.href = 'https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Pacifico:wght@400&family=Parisienne:wght@400&family=Great+Vibes:wght@400&family=Courgette:wght@400&family=Caveat:wght@400;700&family=Alex+Brush:wght@400&family=Tangerine:wght@400;700&family=Amatic+SC:wght@400;700&family=Lobster:wght@400&family=Kaushan+Script:wght@400&family=Cookie:wght@400&family=Shadows+Into+Light:wght@400&family=Yellowtail:wght@400&family=Leckerli+One:wght@400&family=Permanent+Marker:wght@400&family=Rock+Salt:wght@400&family=Sacramento:wght@400&family=Handlee:wght@400&family=Pirata+One:wght@400&family=UnifrakturMaguntia:wght@400&family=Merienda:wght@400;700&display=swap';
          document.head.appendChild(fontLink);
        };
        if ('requestIdleCallback' in window) {
          requestIdleCallback(loadFonts);
        } else {
          setTimeout(loadFonts, 1500);
        }
      });
    </script>

    <!-- Lazy Load Google AdSense on User Interaction or Idle Time to prevent render blocking and TBT -->
    <script>
      (function() {
        var loaded = false;
        function loadAdSense() {
          if (loaded) return;
          loaded = true;
          var script = document.createElement('script');
          script.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1528586776567779';
          script.async = true;
          script.crossOrigin = 'anonymous';
          document.head.appendChild(script);
          ['scroll', 'click', 'touchstart', 'mousemove'].forEach(function(e) {
            window.removeEventListener(e, loadAdSense);
          });
        }
        ['scroll', 'click', 'touchstart', 'mousemove'].forEach(function(e) {
          window.addEventListener(e, loadAdSense, { passive: true, once: true });
        });
        if ('requestIdleCallback' in window) {
          requestIdleCallback(function() { setTimeout(loadAdSense, 5000); });
        } else {
          setTimeout(loadAdSense, 5000);
        }
      })();
    </script>
