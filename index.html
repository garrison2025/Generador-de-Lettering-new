<!doctype html>
<html lang="es" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#5A4AD2" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="Conversor y generador de letras bonitas, tipografías elegantes, cursivas y góticas para copiar y pegar en Instagram, TikTok, Facebook y WhatsApp." />
    <meta name="keywords" content="letras bonitas, conversor de letras, tipografias, letras para Instagram, letras cursivas, letras góticas, copiar y pegar" />
    <meta name="author" content="LetrasPro" />
    
    <!-- Open Graph Default Fallbacks -->
    <meta property="og:site_name" content="LetrasPro" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:image" content="https://generadordelettering.org/og-image.jpg" />
    
    <!-- Preconnect to Font APIs and Preload Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="preload" as="style" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    
    <!-- Icons and PWA -->
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <!-- VitePWA will inject the manifest link automatically, but we can also explicitly add it if we want. It's safer to let Vite inject it or add it if it's static -->
    
    <!-- Twitter Cards Default -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@letraspro" />
    
    <title>Conversor de Letras Bonitas | Generador de Tipografías</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
